name: Refresh and deploy market data
on:
  push:
    branches: [main]
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'schedule' || vars.FETCHR_EXTERNAL_SCHEDULER != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Select daily category cache
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        with:
          path: data/categories.json
          key: coingecko-categories-v1-${{ steps.date.outputs.day }}
      - name: Fetch categories if not cached
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python categories.py
      - name: Generate complete snapshot
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FETCHR_ASSET_COUNT: ${{ vars.FETCHR_ASSET_COUNT || '2500' }}
        run: python generate.py
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages
          path: site
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
      - name: Allow artifact discovery to catch up
        if: steps.deployment.outcome == 'failure'
        run: sleep 10
      - name: Retry deployment of the same artifact
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages
