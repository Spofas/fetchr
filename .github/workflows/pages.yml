name: Refresh and deploy market data
on:
  push:
    branches: [main]
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'schedule' || vars.FETCHR_EXTERNAL_SCHEDULER != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select daily category cache
        id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/categories.json
          key: coingecko-categories-v1-${{ steps.date.outputs.day }}
      - name: Fetch categories if not cached
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python categories.py
      - name: Generate complete snapshot
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FETCHR_ASSET_COUNT: ${{ vars.FETCHR_ASSET_COUNT || '2500' }}
        run: python generate.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
